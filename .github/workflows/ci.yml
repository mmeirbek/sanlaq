name: CI

# Тесты — на каждый PR и push. Web-сборка и деплой на GitHub Pages — только из
# main и только если тесты зелёные.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
      - name: Run tests
        run: tools/run_tests.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.5.0"
      # Настройки — gdlintrc в корне. gdformat не запускаем: у проекта свой
      # стиль пустых строк, переформатирование тронуло бы 75 файлов.
      - name: gdlint
        run: gdlint scenes scripts autoload tools

  build-web:
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          export-templates: "true"
      - name: Import resources
        run: godot --headless --import --path .
      - name: Export web build
        run: |
          mkdir -p export/web
          godot --headless --export-release "Web" --path . export/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
